<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// One Euro Filter: heavy smoothing when the signal is slow (kills jitter),
// light smoothing when it is fast (kills lag).
class OneEuro {
  constructor(minCutoff = 1.5, beta = 0.01, dCutoff = 1) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.x = null;
    this.dx = 0;
  }

  static alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }

  filter(v, dt) {
    if (this.x === null) {
      this.x = v;
      return v;
    }
    const dx = (v - this.x) / dt;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * (dx - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (v - this.x);
    return this.x;
  }
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const smoothstep = (a, b, v) => {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};


const RING = 120; // perimeter samples; divisible by 1..5 so corners stay sharp
const PILLARS = 5;
const HALF_H = 0.7;
const GHOSTS = 10;
const GHOST_STEP = 0.4; // frames of history between neighbouring ghosts (sub-frame, so the trail is dense)
const MORPH_K = 240; // per-vertex spring: underdamped, so the outline wobbles into the new shape
const MORPH_C = 15;

const COLORS = [0xc8d8ff, 0x7df9ff, 0x7dffb2, 0xffe66d, 0xffa05a, 0xff6bd6].map((c) => new THREE.Color(c));

// Point on the perimeter of a regular n-gon (radius 1) at fraction t.
// n = 0 is a circle, n = 1 collapses to a point (the prism becomes a single line).
function perimeter(n, t, out) {
  if (n === 0) {
    out[0] = Math.cos(t * Math.PI * 2);
    out[1] = Math.sin(t * Math.PI * 2);
  } else if (n === 1) {
    out[0] = out[1] = 0;
  } else {
    const u = t * n;
    const k = Math.floor(u);
    const f = u - k;
    const a0 = (k / n) * Math.PI * 2;
    const a1 = ((k + 1) / n) * Math.PI * 2;
    out[0] = Math.cos(a0) + (Math.cos(a1) - Math.cos(a0)) * f;
    out[1] = Math.sin(a0) + (Math.sin(a1) - Math.sin(a0)) * f;
  }
  return out;
}

function lineMaterial() {
  // MAX blending: overlapping segment caps and ghosts never add up into bright beads.
  return new LineMaterial({
    linewidth: 2.4,
    transparent: true,
    depthTest: false,
    blending: THREE.CustomBlending,
    blendEquation: THREE.MaxEquation,
    blendSrc: THREE.OneFactor,
    blendDst: THREE.OneFactor,
  });
}

/** Wireframe prism whose base morphs between n-gons, plus trailing ghost copies for motion blur. */
function createFigure(scene) {
  const NV = RING + PILLARS;
  const cur = new Float32Array(NV * 2);
  const vel = new Float32Array(NV * 2);
  const tgt = new Float32Array(NV * 2);
  const tmp = [0, 0];

  const geometry = new LineSegmentsGeometry();
  geometry.setPositions(new Float32Array((RING * 2 + PILLARS) * 6));
  const buffer = geometry.attributes.instanceStart.data;

  const layers = [];
  for (let i = 0; i <= GHOSTS; i++) {
    const mesh = new LineSegments2(geometry, lineMaterial());
    mesh.frustumCulled = false;
    mesh.renderOrder = GHOSTS - i;
    scene.add(mesh);
    layers.push(mesh);
  }

  // CSS blur/drop-shadow telefonni sekinlashtiradi: nur o'rniga ikkita keng, xira chiziq qatlami.
  const glows = [[7, 0.36], [17, 0.15]].map(([w, k]) => {
    const m = new LineSegments2(geometry, lineMaterial());
    m.material.linewidth = w;
    m.frustumCulled = false;
    m.renderOrder = -1;
    m.userData.k = k;
    scene.add(m);
    return m;
  });

  const color = COLORS[0].clone();
  let sides = 0;

  function setSides(n) {
    sides = n;
    for (let i = 0; i < RING; i++) {
      perimeter(n, i / RING, tmp);
      tgt[i * 2] = tmp[0];
      tgt[i * 2 + 1] = tmp[1];
    }
    for (let j = 0; j < PILLARS; j++) {
      perimeter(n, n === 0 ? j / PILLARS : (j % n) / n, tmp);
      tgt[(RING + j) * 2] = tmp[0];
      tgt[(RING + j) * 2 + 1] = tmp[1];
    }
  }
  setSides(0);
  cur.set(tgt);

  function seg(arr, s, ax, ay, az, bx, by, bz) {
    const o = s * 6;
    arr[o] = ax;
    arr[o + 1] = ay;
    arr[o + 2] = az;
    arr[o + 3] = bx;
    arr[o + 4] = by;
    arr[o + 5] = bz;
  }

  function update(dt) {
    for (let i = 0; i < NV * 2; i++) {
      vel[i] += (MORPH_K * (tgt[i] - cur[i]) - MORPH_C * vel[i]) * dt;
      cur[i] += vel[i] * dt;
    }
    const arr = buffer.array;
    for (let i = 0; i < RING; i++) {
      const j = (i + 1) % RING;
      seg(arr, i, cur[i * 2], HALF_H, cur[i * 2 + 1], cur[j * 2], HALF_H, cur[j * 2 + 1]);
      seg(arr, RING + i, cur[i * 2], -HALF_H, cur[i * 2 + 1], cur[j * 2], -HALF_H, cur[j * 2 + 1]);
    }
    for (let p = 0; p < PILLARS; p++) {
      const x = cur[(RING + p) * 2];
      const z = cur[(RING + p) * 2 + 1];
      seg(arr, RING * 2 + p, x, -HALF_H, z, x, HALF_H, z);
    }
    buffer.needsUpdate = true;
    color.lerp(COLORS[sides], 1 - Math.exp(-8 * dt));
  }

  /**
   * poses[0] is the current pose, poses[1..] are previous frames.
   * `motion` (0..1) controls how visible the trailing ghosts are.
   */
  function place(poses, visibility, motion) {
    layers.forEach((mesh, i) => {
      const f = Math.min(i * GHOST_STEP, poses.length - 1);
      const a0 = poses[Math.floor(f)];
      const a1 = poses[Math.ceil(f)];
      const k = f - Math.floor(f);
      mesh.position.set(a0.x + (a1.x - a0.x) * k, a0.y + (a1.y - a0.y) * k, 0);
      mesh.quaternion.slerpQuaternions(a0.q, a1.q, k);
      mesh.scale.setScalar(a0.r + (a1.r - a0.r) * k);
      const a = i === 0 ? visibility : visibility * motion * 0.55 * (1 - i / (GHOSTS + 1));
      mesh.visible = a > 0.01;
      // Premultiplied output: the canvas is transparent over the video.
      mesh.material.color.copy(color).multiplyScalar(a);
      mesh.material.opacity = a;
    });
    const m0 = layers[0];
    for (const g of glows) {
      g.position.copy(m0.position);
      g.quaternion.copy(m0.quaternion);
      g.scale.copy(m0.scale);
      g.visible = m0.visible;
      g.material.color.copy(color).multiplyScalar(visibility * g.userData.k);
      g.material.opacity = visibility * g.userData.k;
    }
  }

  function resize(w, h) {
    for (const mesh of [...layers, ...glows]) mesh.material.resolution.set(w, h);
  }

  return { setSides, update, place, resize, color, ghosts: GHOSTS };
}


const PALM = [0, 5, 9, 13, 17];
const TIPS = [4, 8, 12, 16, 20];
const FINGERS = [
  [5, 6, 8],
  [9, 10, 12],
  [13, 14, 16],
  [17, 18, 20],
];

const LEAD_GRACE_MS = 500; // lead survives short detection dropouts
const TOOL_GRACE_MS = 300;
// Openness (mean fingertip distance from palm centre / palm length) of a fist and of a spread hand.
// The ranges are deliberately narrower than the full motion, so a partial squeeze already covers the whole scale.
const OPEN_MIN = 0.65;
const OPEN_MAX = 0.95;
// Thumb tip to index tip distance / palm length: pinched vs spread.
const PINCH_MIN = 0.25;
const PINCH_MAX = 0.9;

const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

// Uses metric world landmarks, so the result does not depend on distance to the camera.
function countFingers(w) {
  let n = 0;
  for (const [mcp, pip, tip] of FINGERS) {
    if (dist3(w[tip], w[0]) > dist3(w[pip], w[0]) * 1.12 && dist3(w[tip], w[mcp]) > dist3(w[pip], w[mcp]) * 1.25) n++;
  }
  // Thumb: stuck out when its tip is far from the pinky knuckle relative to palm width.
  if (dist3(w[4], w[17]) > dist3(w[5], w[17]) * 1.4) n++;
  return n;
}

function openness(w) {
  const c = { x: 0, y: 0, z: 0 };
  for (const i of PALM) {
    c.x += w[i].x / PALM.length;
    c.y += w[i].y / PALM.length;
    c.z += w[i].z / PALM.length;
  }
  let sum = 0;
  for (const i of TIPS) sum += dist3(w[i], c);
  const palm = dist3(w[0], w[9]);
  const open = clamp((sum / TIPS.length / palm - OPEN_MIN) / (OPEN_MAX - OPEN_MIN), 0, 1);
  const pinch = clamp((dist3(w[4], w[8]) / palm - PINCH_MIN) / (PINCH_MAX - PINCH_MIN), 0, 1);
  // Either closing the whole hand or pinching thumb and index shrinks the figure.
  return Math.min(open, pinch);
}

class Track {
  constructor(d, now) {
    this.t = now;
    this.seen = now;
    this.fx = new OneEuro(1.5, 0.012);
    this.fy = new OneEuro(1.5, 0.012);
    this.fs = new OneEuro(0.8, 0.003);
    this.fo = new OneEuro(2.5, 2.0);
    this.ftx = new OneEuro(2.5, 0.02);
    this.fty = new OneEuro(2.5, 0.02);
    this.hist = [];
    this.fingers = d.fingers;
    this.vx = this.vy = this.twist = this.openRate = 0;
    this.tipX = this.tipY = this.angle = null;
    this.update(d, now);
  }

  update(d, now) {
    const dt = Math.max(1 / 120, (now - this.t) / 1000);
    this.t = this.seen = now;
    this.rawX = d.x;
    this.rawY = d.y;
    this.pts = d.pts;
    this.x = this.fx.filter(d.x, dt);
    this.y = this.fy.filter(d.y, dt);
    this.size = this.fs.filter(d.size, dt);

    // Debounce: the finger count switches only after 3 identical frames in a row.
    this.hist.push(d.fingers);
    if (this.hist.length > 3) this.hist.shift();
    if (this.hist.length === 3 && this.hist.every((v) => v === d.fingers)) this.fingers = d.fingers;

    const open = this.fo.filter(d.open, dt);
    if (this.open !== undefined) this.openRate += 0.5 * ((open - this.open) / dt - this.openRate);
    this.open = open;

    const tx = this.ftx.filter(d.pts[8].x, dt);
    const ty = this.fty.filter(d.pts[8].y, dt);
    if (this.tipX !== null) {
      this.vx += 0.6 * ((tx - this.tipX) / dt - this.vx);
      this.vy += 0.6 * ((ty - this.tipY) / dt - this.vy);
      this.twist += 0.5 * (wrapAngle(d.angle - this.angle) / dt - this.twist);
    }
    this.tipX = tx;
    this.tipY = ty;
    this.angle = d.angle;
  }
}

/**
 * Starts hand tracking on the video. Returns read(now) -> { lead, tool, hands }.
 * The first hand to enter the frame becomes the lead; the second one is the tool.
 */
async function startTracking(video, view) {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const make = (d) => HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL, delegate: d },
    runningMode: 'VIDEO',
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
  let delegate = 'GPU';
  let landmarker;
  try {
    landmarker = await make('GPU');
  } catch (e) {
    console.warn("GPU yo'q, CPU ishlatiladi", e);
    delegate = 'CPU';
    landmarker = await make('CPU');
  }

  let lead = null;
  let tool = null;

  // Normalised landmark -> mirrored screen pixels, accounting for object-fit: cover.
  function toPx(lm) {
    const s = Math.max(view.W / video.videoWidth, view.H / video.videoHeight);
    const dw = video.videoWidth * s;
    const dh = video.videoHeight * s;
    return { x: (view.W - dw) / 2 + (1 - lm.x) * dw, y: (view.H - dh) / 2 + lm.y * dh };
  }

  function measure(lm, world) {
    const pts = lm.map(toPx);
    let x = 0;
    let y = 0;
    for (const i of PALM) {
      x += pts[i].x / PALM.length;
      y += pts[i].y / PALM.length;
    }
    return {
      pts,
      x,
      y,
      size: Math.max(dist2(pts[0], pts[9]), dist2(pts[5], pts[17]) * 1.3),
      fingers: countFingers(world),
      open: openness(world),
      angle: Math.atan2(pts[9].y - pts[0].y, pts[9].x - pts[0].x),
    };
  }

  const gap = (tr, d) => Math.hypot(d.x - tr.rawX, d.y - tr.rawY);
  const near = (tr, d) => gap(tr, d) < Math.max(view.W * 0.25, tr.size * 3);

  let ver = 0, hz = 0, hzN = 0, hzT = performance.now(), lastDetEnd = 0, interval = 50;
  function process(result, now) {
    ver++;
    const dets = result.landmarks.map((lm, i) => measure(lm, result.worldLandmarks[i]));

    // Keep identities by position: MediaPipe does not give stable hand ids.
    if (lead && tool && dets.length === 2) {
      const [a, b] = dets;
      const straight = gap(lead, a) + gap(tool, b) <= gap(lead, b) + gap(tool, a);
      lead.update(straight ? a : b, now);
      tool.update(straight ? b : a, now);
      dets.length = 0;
    } else {
      for (const tr of [lead, tool]) {
        if (!tr || !dets.length) continue;
        let best = 0;
        for (let i = 1; i < dets.length; i++) if (gap(tr, dets[i]) < gap(tr, dets[best])) best = i;
        if (near(tr, dets[best])) tr.update(dets.splice(best, 1)[0], now);
      }
    }
    for (const d of dets) {
      if (!lead) lead = new Track(d, now);
      else if (!tool) tool = new Track(d, now);
    }
  }

  function expire(now) {
    if (tool && now - tool.seen > TOOL_GRACE_MS) {
      tool = null;
      ver++;
    }
    if (lead && now - lead.seen > LEAD_GRACE_MS) {
      lead = tool; // the remaining hand takes over the figure
      tool = null;
      ver++;
    }
  }

  // Aniqlash asosiy oqimning ko'pi bilan ~60% ini egallasin: qolgan vaqtda ekran silliq chiziladi.
  let nextAt = 0;
  let cost = 30;
  const onFrame = () => {
    const now = performance.now();
    if (video.videoWidth && now >= nextAt) {
      const result = landmarker.detectForVideo(video, now);
      const t1 = performance.now();
      cost += (t1 - now - cost) * 0.3;
      interval = Math.max(33, cost * 1.6);
      nextAt = now + interval;
      lastDetEnd = t1;
      hzN++;
      if (t1 - hzT > 1000) {
        hz = Math.round((hzN * 1000) / (t1 - hzT));
        hzN = 0;
        hzT = t1;
      }
      process(result, t1);
    }
    next(onFrame);
  };
  const next = video.requestVideoFrameCallback ? (f) => video.requestVideoFrameCallback(f) : (f) => requestAnimationFrame(f);
  next(onFrame);

  return {
    delegate,
    read(now) {
      expire(now);
      return {
        ver,
        hz,
        lastDetEnd,
        lead: lead && { x: lead.x, y: lead.y, size: lead.size, fingers: lead.fingers },
        tool: tool && {
          open: tool.open,
          openRate: tool.openRate,
          vx: tool.vx,
          vy: tool.vy,
          twist: tool.twist,
          fresh: now - tool.seen < Math.max(120, interval * 1.6),
        },
        hands: [lead, tool].filter(Boolean).map((tr) => tr.pts),
      };
    },
  };
}

function choose() {
  return new Promise((res) => {
    const ov = document.getElementById('start');
    document.getElementById('go').onclick = () => { ov.remove(); res('cam'); };
    document.getElementById('demoBtn').onclick = () => { ov.remove(); res('demo'); };
  });
}


const CFG = {
  hover: 2.3, // figure hovers this many palm lengths above the palm centre
  radius: 0.8, // figure radius in palm lengths at scale 1
  followK: 180, // position spring: stiff enough to feel responsive...
  followC: 16, // ...underdamped enough to trail and overshoot a little
  gravity: 1400, // px/s^2, pulls the figure down once the lead hand is gone
  scaleMin: 0.35,
  scaleMax: 3.2,
  idleSpin: 0.9, // rad/s
  spinFriction: 0.7,
  spinGain: 0.84,
  maxBlur: 6,
};

const video = document.getElementById('cam');
const sceneCanvas = document.getElementById('scene');
const skeleton = document.getElementById('skeleton');
const statusEl = document.getElementById('status');
const hud = document.getElementById('hud');
const sk = skeleton.getContext('2d');

const view = { W: innerWidth, H: innerHeight };
const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 10000);
const figure = createFigure(scene);

let dprCap = 2;
function resize() {
  view.W = innerWidth;
  view.H = innerHeight;
  const dpr = Math.min(devicePixelRatio, dprCap);
  const sdpr = Math.min(dpr, 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(view.W, view.H, false);
  skeleton.width = view.W * sdpr;
  skeleton.height = view.H * sdpr;
  sk.setTransform(sdpr, 0, 0, sdpr, 0, 0);
  // Camera distance is chosen so that 1 world unit == 1 CSS pixel on the z = 0 plane.
  camera.aspect = view.W / view.H;
  camera.position.set(view.W / 2, -view.H / 2, view.H / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.updateProjectionMatrix();
  figure.resize(view.W, view.H);
}
addEventListener('resize', resize);
resize();

// --- simulation state -------------------------------------------------------
const pos = { x: view.W / 2, y: view.H / 2 };
const vel = { x: 0, y: 0 };
let radius = 90;
let scale = 1;
let scaleV = 0;
let scaleTarget = 1;
let pop = 1; // extra scale spring used for appear / morph "pop"
let popV = 0;
let visibility = 0;
let pulse = 0; // decaying kick after the shape changes
let blur = 0;
let sides = -1;
let spinY = 0;
const omega = new THREE.Vector3();
const qUser = new THREE.Quaternion();
const qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.5);
const qSpin = new THREE.Quaternion();
const qBank = new THREE.Quaternion();
const dq = new THREE.Quaternion();
const axis = new THREE.Vector3();
const euler = new THREE.Euler();
const Y = new THREE.Vector3(0, 1, 0);
const poses = [];

function step(input, dt, t) {
  const { lead, tool } = input;

  if (lead) {
    radius += (lead.size * CFG.radius - radius) * (1 - Math.exp(-10 * dt));
    // Target: above the hand, with a small orbit and bob so it never sits dead still.
    const tx = lead.x + Math.cos(t * 1.7) * lead.size * 0.12;
    const ty = lead.y - lead.size * CFG.hover + Math.sin(t * 2.3) * lead.size * 0.08;
    if (visibility < 0.05) {
      pos.x = tx;
      pos.y = ty;
      vel.x = vel.y = 0;
      pop = 0.3;
    }
    vel.x += (CFG.followK * (tx - pos.x) - CFG.followC * vel.x) * dt;
    vel.y += (CFG.followK * (ty - pos.y) - CFG.followC * vel.y) * dt;
    visibility += (1 - visibility) * (1 - Math.exp(-8 * dt));

    if (lead.fingers !== sides) {
      const first = sides < 0;
      sides = lead.fingers;
      figure.setSides(sides);
      if (!first) {
        pulse = 1;
        popV += 5;
        omega.y += 5;
      }
    }
  } else {
    vel.y += CFG.gravity * dt;
    visibility *= Math.exp(-4 * dt);
  }
  pos.x += vel.x * dt;
  pos.y += vel.y * dt;

  if (tool?.fresh) {
    scaleTarget = CFG.scaleMin + (CFG.scaleMax - CFG.scaleMin) * tool.open;
    // Trackball: fast finger flicks drag the surface, slow return strokes barely touch it.
    // Ignored while the hand is opening/closing so scaling does not spin the figure.
    const steady = 1 - smoothstep(1, 2.5, Math.abs(tool.openRate));
    const r = Math.max(40, radius * scale);
    const wSwipe = smoothstep(150, 900, Math.hypot(tool.vx, tool.vy)) * steady;
    const kSwipe = 1 - Math.exp(-14 * wSwipe * dt);
    omega.x += ((tool.vy / r) * CFG.spinGain - omega.x) * kSwipe;
    omega.y += ((tool.vx / r) * CFG.spinGain - omega.y) * kSwipe;
    const kTwist = 1 - Math.exp(-14 * smoothstep(1, 5, Math.abs(tool.twist)) * steady * dt);
    omega.z += (-tool.twist * CFG.spinGain - omega.z) * kTwist;
  }
  scaleV += (320 * (scaleTarget - scale) - 20 * scaleV) * dt;
  scale += scaleV * dt;
  popV += (260 * (1 - pop) - 14 * popV) * dt;
  pop += popV * dt;

  omega.clampLength(0, 21).multiplyScalar(Math.exp(-CFG.spinFriction * dt));
  const angle = omega.length() * dt;
  if (angle > 1e-6) qUser.premultiply(dq.setFromAxisAngle(axis.copy(omega).normalize(), angle)).normalize();
  spinY += CFG.idleSpin * dt;
  qSpin.setFromAxisAngle(Y, spinY);
  // Lean into the motion, like something light being dragged through the air.
  qBank.setFromEuler(euler.set(clamp(vel.y * 0.00045, -0.5, 0.5), 0, clamp(vel.x * 0.00045, -0.5, 0.5)));

  figure.update(dt);
  pulse *= Math.exp(-5 * dt);
}

// Once per rendered frame: record the pose for the ghost trail and set the blur.
function present(dt) {
  const speed = Math.hypot(vel.x, vel.y);
  const spin = omega.length();
  const pose = poses.length > figure.ghosts ? poses.pop() : { q: new THREE.Quaternion() };
  pose.x = pos.x;
  pose.y = -pos.y;
  pose.r = Math.max(1, radius * scale * pop);
  pose.q.copy(qBank).multiply(qUser).multiply(qTilt).multiply(qSpin);
  poses.unshift(pose);
  figure.place(poses, visibility, clamp(speed / 700 + spin / 8 + pulse, 0, 1));

}

// --- hand skeleton overlay --------------------------------------------------
const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11],
  [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17],
];

function drawHands(hands) {
  sk.clearRect(0, 0, view.W, view.H);
  hands.forEach((pts, i) => {
    sk.strokeStyle = sk.fillStyle = i === 0 ? 'rgba(125,249,255,0.45)' : 'rgba(255,107,214,0.45)';
    sk.lineWidth = 1;
    sk.beginPath();
    for (const [a, b] of BONES) {
      sk.moveTo(pts[a].x, pts[a].y);
      sk.lineTo(pts[b].x, pts[b].y);
    }
    sk.stroke();
    for (const p of pts) {
      sk.beginPath();
      sk.arc(p.x, p.y, 2, 0, Math.PI * 2);
      sk.fill();
    }
  });
}

// --- input ------------------------------------------------------------------
// `?demo` drives the figure with a synthetic hand, to check rendering without a camera.
function demoInput(t) {
  const fast = Math.sin(t * 0.5) > 0.3 ? 2 : 0.6;
  return {
    lead: {
      x: view.W / 2 + Math.sin(t * 1.1 * fast) * view.W * 0.25,
      y: view.H * 0.7 + Math.cos(t * 0.8) * view.H * 0.08,
      size: 110,
      fingers: Math.floor(t / 2) % 6,
    },
    tool: t % 12 > 6 && {
      open: 0.5 + 0.5 * Math.sin(t * 1.5),
      openRate: 0.75 * Math.cos(t * 1.5),
      vx: 700 * Math.sin(t * 2),
      vy: 0,
      twist: 0,
      fresh: true,
    },
    hands: [],
  };
}

async function openCamera(hq) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: 'user', width: { ideal: hq ? 1280 : 640 }, height: { ideal: hq ? 720 : 480 }, frameRate: { ideal: 30 } },
  });
  video.srcObject = stream;
  await video.play();
}

async function main() {
  let read;
  const mode = new URLSearchParams(location.search).has('demo') ? (document.getElementById('start').remove(), 'demo') : await choose();
  if (mode === 'demo') {
    read = (now) => demoInput(now / 1000);
  } else {
    statusEl.style.opacity = 1;
    statusEl.textContent = 'Model yuklanmoqda…';
    const tracker = await startTracking(video, view);
    await openCamera(tracker.delegate === 'GPU');
    read = tracker.read;
  }

  let last = performance.now();
  let fps = 60;
  let frame = 0;
  let lastVer = -1;
  let winN = 0;
  let winSlow = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const rawDt = (now - last) / 1000;
    last = now;
    const input = read(now);
    // Substeps keep the springs stable when a frame is dropped.
    const dt = Math.min(rawDt, 0.05);
    const n = Math.max(1, Math.ceil(dt / (1 / 120)));
    for (let i = 0; i < n; i++) step(input, dt / n, now / 1000 - dt + ((i + 1) * dt) / n);
    present(dt);
    renderer.render(scene, camera);
    if (input.ver !== lastVer) {
      lastVer = input.ver;
      drawHands(input.hands);
    }
    // Ekran sekinlashsa, aniqlik avtomatik biroz pasayadi (faqat aniqlash bo'lmagan kadrlar o'lchanadi).
    if (now - (input.lastDetEnd || 0) > 80) {
      winN++;
      if (rawDt > 0.03) winSlow++;
      if (winN >= 90) {
        if (winSlow > 45 && dprCap > 1) {
          dprCap = Math.max(1, dprCap - 0.25);
          resize();
        }
        winN = winSlow = 0;
      }
    }

    fps += (1 / Math.max(rawDt, 1e-3) - fps) * 0.05;
    if (frame++ % 10 === 0) {
      statusEl.style.opacity = input.lead ? 0 : 1;
      statusEl.textContent = "Qo'lingizni kameraga ko'rsating";
      const stat = `${fps.toFixed(0)} fps · ${input.hz || 0} Hz`;
      hud.textContent = input.lead
        ? `asosiy qo'l: ${input.lead.fingers} · ikkinchi qo'l: ${input.tool ? `masshtab ×${scale.toFixed(2)}` : "yo'q"} · ${stat}`
        : stat;
    }
  }
  requestAnimationFrame(loop);
}

main().catch((err) => {
  console.error(err);
  statusEl.style.opacity = 1;
  statusEl.textContent =
    err.name === 'NotAllowedError'
      ? "Kameraga ruxsat yo'q. Sahifaga kamerani ruxsat qilib, yangilang."
      : `Ishga tushmadi: ${err.message}`;
});

</script>
