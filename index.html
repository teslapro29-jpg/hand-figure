<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qilich va Kamon</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  video,canvas{position:absolute;max-width:100%;max-height:100%;width:auto;height:auto}
  video{transform:scaleX(-1);opacity:.55}
  #ui{position:absolute;top:12px;left:12px;right:12px;z-index:5;text-align:center;font-size:14px;text-shadow:0 1px 4px #000}
  #mode{font-size:20px;font-weight:700;margin-top:4px}
  button{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;font-size:18px;border:0;border-radius:12px;background:#ffb703;color:#111;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="ui">✊ Mushtni siq = QILICH &nbsp; ✋ Kaftni och = KAMON &nbsp; 🤏 Ikkinchi qo‘l bilan tort va qo‘yib yubor = O‘Q
    <div id="mode">Kamerani yoqing</div></div>
  <button id="start">Boshlash</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('v'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const modeEl = document.getElementById('mode');
let W = 1280, H = 720;
const S = { hands: [], weapon: null, mode: 'none', pinching: false, pinchPt: null, pull: 0, arrows: [], sparks: [] };

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;

function analyze(lm) {
  const p = lm.map(q => ({ x: (1 - q.x) * W, y: q.y * H }));
  const palm = dist(p[0], p[9]);
  let curled = 0;
  [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([tip, pip]) => { if (dist(p[tip], p[0]) < dist(p[pip], p[0])) curled++; });
  const pinch = dist(p[4], p[8]) < palm * 0.45;
  return {
    p, palm,
    fist: curled >= 3,
    open: curled <= 1,
    pinch,
    center: { x: (p[0].x + p[9].x) / 2, y: (p[0].y + p[9].y) / 2 },
    pinchPt: { x: (p[4].x + p[8].x) / 2, y: (p[4].y + p[8].y) / 2 },
    up: { x: (p[9].x - p[0].x) / (palm || 1), y: (p[9].y - p[0].y) / (palm || 1) }
  };
}

function onResults(r) {
  if (cv.width !== W) { cv.width = W; cv.height = H; }
  const hs = (r.multiHandLandmarks || []).map(analyze).sort((a, b) => a.center.x - b.center.x);
  S.hands = hs;
  // chap tomondagi qo'l = qurol qo'li, o'ngdagisi = tortuvchi qo'l
  const wh = hs[0] || null, dh = hs.length > 1 ? hs[hs.length - 1] : null;
  S.weapon = wh;
  if (wh) S.mode = wh.fist ? 'sword' : (wh.open ? 'bow' : S.mode === 'none' ? 'bow' : S.mode);
  else S.mode = 'none';

  const pinchNow = !!(dh && dh.pinch && S.mode === 'bow');
  if (pinchNow) {
    S.pinchPt = dh.pinchPt;
    S.pull = dist(dh.pinchPt, wh.center);
  }
  if (S.pinching && !pinchNow && S.mode === 'bow' && wh && S.pinchPt) {
    const minPull = wh.palm * 1.3;
    if (S.pull > minPull) fire(wh.center, S.pinchPt, S.pull);
  }
  if (!pinchNow) { S.pull = 0; }
  S.pinching = pinchNow;
  S.dh = dh;
  modeEl.textContent = S.mode === 'sword' ? '⚔️ QILICH' : S.mode === 'bow' ? (S.pinching ? '🏹 Tortilmoqda... qo‘yib yubor!' : '🏹 KAMON') : 'Qo‘lingizni ko‘rsating';
}

function fire(bowC, pinchPt, pull) {
  const dx = bowC.x - pinchPt.x, dy = bowC.y - pinchPt.y, d = Math.hypot(dx, dy) || 1;
  const speed = Math.min(60, 16 + pull * 0.07);
  S.arrows.push({ x: bowC.x, y: bowC.y, vx: dx / d * speed, vy: dy / d * speed, life: 0 });
}

function drawSword(h) {
  const ux = h.up.x, uy = h.up.y, nx = -uy, ny = ux;
  const o = h.center, L = h.palm * 4.2;
  ctx.save();
  ctx.translate(o.x, o.y);
  const ang = Math.atan2(uy, ux) + Math.PI / 2;
  ctx.rotate(ang);
  ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 25;
  const g = ctx.createLinearGradient(-8, 0, 8, 0);
  g.addColorStop(0, '#94a3b8'); g.addColorStop(.5, '#f8fafc'); g.addColorStop(1, '#94a3b8');
  ctx.fillStyle = g;
  const bw = h.palm * 0.22;
  ctx.beginPath(); ctx.moveTo(-bw, -h.palm * .55); ctx.lineTo(-bw, -L); ctx.lineTo(0, -L - bw * 2.5); ctx.lineTo(bw, -L); ctx.lineTo(bw, -h.palm * .55); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#facc15'; ctx.fillRect(-bw * 2.6, -h.palm * .62, bw * 5.2, bw * .9);
  ctx.fillStyle = '#7c2d12'; ctx.fillRect(-bw * .6, -h.palm * .55 + bw * .3, bw * 1.2, h.palm * .9);
  ctx.restore();
}

function drawBow(h) {
  const tgt = (S.pinching && S.pinchPt) ? S.pinchPt : (S.dh ? S.dh.center : { x: h.center.x + 100, y: h.center.y });
  let dx = h.center.x - tgt.x, dy = h.center.y - tgt.y;
  const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;           // otish yo'nalishi
  const nx = -dy, ny = dx, R = h.palm * 2.6;
  const A = { x: h.center.x + nx * R, y: h.center.y + ny * R };
  const B = { x: h.center.x - nx * R, y: h.center.y - ny * R };
  const bulge = h.palm * 1.2;
  const C = { x: h.center.x + dx * bulge * 2, y: h.center.y + dy * bulge * 2 };
  ctx.save();
  ctx.lineCap = 'round';
  ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 18;
  ctx.strokeStyle = '#b45309'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(C.x, C.y, B.x, B.y); ctx.stroke();
  ctx.shadowBlur = 0;
  // ip
  const mid = (S.pinching && S.pinchPt) ? S.pinchPt : { x: h.center.x + dx * bulge, y: h.center.y + dy * bulge };
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(mid.x, mid.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  // joylangan o'q
  if (S.pinching) {
    const len = h.palm * 2.4;
    drawArrow(mid.x, mid.y, -dx, -dy, len, true);
    const pct = Math.min(1, S.pull / (h.palm * 4));
    ctx.fillStyle = `hsl(${120 * (1 - pct)},90%,55%)`;
    ctx.fillRect(h.center.x - 40, h.center.y + R + 20, 80 * pct, 8);
  }
  ctx.restore();
}

function drawArrow(x, y, dx, dy, len, fromTail) {
  // (x,y) = dumi; (dx,dy) = ketayotgan yo'nalish
  const hx = x + dx * len, hy = y + dy * len;
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = '#e5e7eb';
  const nx = -dy, ny = dx;
  ctx.beginPath(); ctx.moveTo(hx + dx * 18, hy + dy * 18); ctx.lineTo(hx + nx * 8, hy + ny * 8); ctx.lineTo(hx - nx * 8, hy - ny * 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f87171';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + nx * 7 - dx * 10, y + ny * 7 - dy * 10); ctx.lineTo(x + dx * 10, y + dy * 10); ctx.lineTo(x - nx * 7 - dx * 10, y - ny * 7 - dy * 10); ctx.closePath(); ctx.fill();
}

function frame() {
  ctx.clearRect(0, 0, W, H);
  const h = S.weapon;
  if (h) { if (S.mode === 'sword') drawSword(h); else if (S.mode === 'bow') drawBow(h); }
  for (let i = S.arrows.length - 1; i >= 0; i--) {
    const a = S.arrows[i];
    a.x += a.vx; a.y += a.vy; a.vy += 0.25; a.life++;
    const sp = Math.hypot(a.vx, a.vy) || 1;
    ctx.save(); ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
    drawArrow(a.x - a.vx / sp * 70, a.y - a.vy / sp * 70, a.vx / sp, a.vy / sp, 70, true);
    ctx.restore();
    if (a.x < -100 || a.x > W + 100 || a.y > H + 100 || a.y < -300 || a.life > 240) S.arrows.splice(i, 1);
  }
  requestAnimationFrame(frame);
}

document.getElementById('start').onclick = async function () {
  this.remove();
  modeEl.textContent = 'Model yuklanmoqda...';
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  hands.onResults(onResults);
  video.addEventListener('loadedmetadata', () => { W = video.videoWidth; H = video.videoHeight; cv.width = W; cv.height = H; });
  const cam = new Camera(video, { onFrame: async () => { await hands.send({ image: video }); }, width: 1280, height: 720 });
  try { await cam.start(); } catch (e) { modeEl.textContent = 'Kameraga ruxsat bering (HTTPS kerak)'; return; }
  frame();
};
</script>
</body>
</html>
