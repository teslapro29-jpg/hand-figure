<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060d">
<title>Hand Control Magic</title>
<style>
:root{--bg:#05060d;--fg:#f4f1ff;--glass:rgba(18,14,30,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover;transform:scaleX(-1);filter:brightness(.42) saturate(.8)}
canvas{pointer-events:none}
#toast{position:fixed;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);padding:9px 18px;border-radius:20px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff2a;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#side{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
#side button{width:48px;height:48px;padding:0;border-radius:50%;font-size:20px;background:var(--glass);border:1px solid #ffffff22;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#side button.on{background:#e5304a}
.logo{font:900 21px/1 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:linear-gradient(90deg,#ffe36b,#ff7a1a 55%,#ff3d8b);-webkit-background-clip:text;background-clip:text;color:transparent}
#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#fps{font-size:12px;opacity:.6}
#hint{position:fixed;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom));text-align:center;font-size:13px;padding:0 16px;opacity:.9;text-shadow:0 1px 8px #000}
#bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff22;max-width:calc(100% - 16px);overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:0;border-radius:18px;padding:10px 13px;white-space:nowrap;cursor:pointer;touch-action:manipulation}
button.on{background:linear-gradient(135deg,#ff8a1f,#ff3d8b);color:#fff}
button:focus-visible{outline:2px solid #ffd24a;outline-offset:2px}
#start{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,#1a103080,#05060df2);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
#start h1{margin:0;font:900 clamp(36px,10vw,68px)/.95 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:linear-gradient(180deg,#fff2a8,#ff9a1f 55%,#ff3d6e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px #ff7a1a66)}
#start p{margin:0;max-width:32ch;opacity:.8}
#go{padding:16px 42px;font-size:18px;font-weight:800;border-radius:32px;background:linear-gradient(135deg,#ffae2b,#ff4d6d);color:#fff;box-shadow:0 10px 34px #ff6a2a66}
#msg{min-height:1.4em;font-size:13px;color:#ffc9a0}
@media (prefers-reduced-motion:reduce){#start{transition:none}}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="sk"></canvas>
<canvas id="tr"></canvas>
<div id="top"><span class="logo">Hand Control Magic</span><span id="fps"></span></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="side"><button id="snap" aria-label="Rasm">📸</button><button id="rec" aria-label="Video yozish">⏺</button><button id="snd" aria-label="Ovoz">🔊</button></div>
<nav id="bar" aria-label="Boshqaruv">
  <button data-m="0" class="on">✨ Zarra</button>
  <button data-m="1">🔷 Prizma</button>
  <button data-m="2">✍️ Chiz</button>
  <button id="shape">🌀 Shakl</button>
  <button id="color">🎨 Rang</button>
  <button id="skel" class="on">🖐 Skelet</button>
  <button id="cam">🔄 Kamera</button>
</nav>
<div id="start">
  <h1>Hand Control<br>Magic</h1>
  <p>Qo‘lingiz bilan zarralar va 3D shakllarni boshqaring.</p>
  <button id="go">Kamerani yoqish</button>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),video=$('#v');
const mobile=/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)||innerWidth<700;
let W=innerWidth,H=innerHeight,mode=0,shapeI=0,palI=0,mix=1,showSk=true,hs=[],lastSeen=0,hands=null;
let dpr=Math.min(devicePixelRatio||1,mobile?1.5:2);const N=mobile?4000:8000;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*Math.random())};

/* ---------- Three.js sahna (piksel koordinatalari) ---------- */
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(dpr);renderer.setSize(W,H);
document.body.insertBefore(renderer.domElement,$('#sk'));
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(0,W,H,0,-3000,3000);

/* ---------- Zarralar (hammasi GPU'da) ---------- */
const A=new Float32Array(N*3),B=new Float32Array(N*3),R=new Float32Array(N*4).map(Math.random);
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
geo.setAttribute('aA',new THREE.BufferAttribute(A,3));
geo.setAttribute('aB',new THREE.BufferAttribute(B,3));
geo.setAttribute('aR',new THREE.BufferAttribute(R,4));
const U={uMix:{value:1},uT:{value:0},uS:{value:200},uB:{value:0},uPx:{value:dpr},
 uC:{value:new THREE.Vector3()},uRot:{value:new THREE.Matrix3()},
 c1:{value:new THREE.Color()},c2:{value:new THREE.Color()},c3:{value:new THREE.Color()}};
const pts=new THREE.Points(geo,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec3 aA;attribute vec3 aB;attribute vec4 aR;
uniform float uMix,uT,uS,uB,uPx;uniform vec3 uC,c1,c2,c3;uniform mat3 uRot;
varying vec3 vC;varying float vA;
void main(){
 vec3 p=mix(aA,aB,smoothstep(0.,1.,uMix));
 float a=uT*(.25+.5*aR.x)/(.35+length(p.xy))*.8,s=sin(a),c=cos(a);
 p.xy=mat2(c,-s,s,c)*p.xy;
 p+=(aR.xyz-.5)*.05*sin(uT*1.7+aR.w*6.283);
 p+=normalize(p+vec3(1e-4))*uB*(.3+aR.y*1.6)*(.65+.35*sin(uT*9.+aR.w*20.));
 p=uRot*p;
 float t=clamp(length(p)/1.1,0.,1.);
 vC=t<.5?mix(c1,c2,t*2.):mix(c2,c3,t*2.-1.);
 vA=.55+.45*aR.z;
 gl_Position=projectionMatrix*modelViewMatrix*vec4(uC+p*uS,1.);
 gl_PointSize=(2.+aR.z*3.5)*uPx*(.6+uS/600.);
}`,
fragmentShader:`varying vec3 vC;varying float vA;
void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);gl_FragColor=vec4(vC*(.7+a),a*vA);}`}));
pts.frustumCulled=false;scene.add(pts);

const shapes=[
 o=>{const r=Math.pow(Math.random(),.62),a=((Math.random()*3)|0)*2.0944+r*6.2+gauss()*.22*(1-r*.5);o[0]=Math.cos(a)*r;o[1]=Math.sin(a)*r;o[2]=gauss()*.07*(1.05-r)},
 o=>{const z=Math.random()*2-1,a=Math.random()*6.2832,q=Math.sqrt(1-z*z),r=.85+gauss()*.03;o[0]=q*Math.cos(a)*r;o[1]=q*Math.sin(a)*r;o[2]=z*r},
 o=>{const t=Math.random()*6.2832,k=Math.pow(Math.random(),.35);o[0]=16*Math.pow(Math.sin(t),3)/17*k;o[1]=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17*k+.05;o[2]=gauss()*.12*k},
 o=>{const u=Math.random()*6.2832,v=Math.random()*6.2832,r=.22+gauss()*.02;o[0]=(.7+r*Math.cos(v))*Math.cos(u);o[1]=(.7+r*Math.cos(v))*Math.sin(u);o[2]=r*Math.sin(v)},
 o=>{const t=Math.random()*6.2832,k=Math.pow(Math.random(),.5),R=(.35+.65*Math.pow(Math.abs(Math.cos(2.5*t)),1.6))*k;o[0]=Math.cos(t+1.5708)*R;o[1]=Math.sin(t+1.5708)*R;o[2]=gauss()*.08*k}
];
function setShape(i,instant){
 const m=Math.min(1,mix),sm=m*m*(3-2*m),o=[0,0,0];
 for(let k=0;k<N*3;k++)A[k]=A[k]*(1-sm)+B[k]*sm;
 for(let n=0;n<N;n++){shapes[i](o);B[n*3]=o[0];B[n*3+1]=o[1];B[n*3+2]=o[2]}
 if(instant)A.set(B);
 geo.attributes.aA.needsUpdate=geo.attributes.aB.needsUpdate=true;mix=instant?1:0;
}
const PAL=[[0xffd24a,0xff5a1a,0xb01cf0],[0xd6ffff,0x2fb4ff,0x4b2bff],[0xeaff7a,0x19e68a,0x0a6ad6],[0xfff0f6,0xff4fa8,0x7a22e0]];
const tc=[new THREE.Color(),new THREE.Color(),new THREE.Color()];
function setPal(instant){PAL[palI].forEach((h,i)=>{tc[i].setHex(h);if(instant)U['c'+(i+1)].value.copy(tc[i])})}
setShape(0,true);setPal(true);

/* ---------- 3D prizma (ikki qo‘l orasida) ---------- */
function mkGeo(seg){const pg=new THREE.CylinderGeometry(1,1,1,seg,28,false);pg.rotateZ(Math.PI/2);
{const p=pg.attributes.position,c=new Float32Array(p.count*3),k=new THREE.Color();
 for(let i=0;i<p.count;i++){const g=Math.atan2(p.getZ(i),p.getY(i));k.setHSL(.45+.2*(.5+.5*Math.sin(g))+.12*(p.getX(i)+.5),.85,.52);c.set([k.r,k.g,k.b],i*3)}
 pg.setAttribute('color',new THREE.BufferAttribute(c,3));}return pg}
let pg=mkGeo(3);
const pm=new THREE.Mesh(pg,new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,transparent:true,opacity:.9,shininess:120,specular:0xffffff,side:THREE.DoubleSide}));
const lm=new THREE.LineSegments(new THREE.EdgesGeometry(pg),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.95}));pm.add(lm);
function mkPrism(seg){pm.geometry.dispose();lm.geometry.dispose();pg=mkGeo(seg);pm.geometry=pg;lm.geometry=new THREE.EdgesGeometry(pg)}
const pr=new THREE.Group();pr.add(pm);pr.visible=false;scene.add(pr);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const l1=new THREE.DirectionalLight(0xffffff,1.1);l1.position.set(-300,400,600);scene.add(l1);
const l2=new THREE.DirectionalLight(0xff9a40,.6);l2.position.set(400,-200,300);scene.add(l2);

/* ---------- Qo‘l ma’lumotlari ---------- */
let mir=true;const mapPt=(l,vw,vh)=>{const s=Math.max(W/vw,H/vh),X=l.x*vw*s+(W-vw*s)/2;return[mir?W-X:X,l.y*vh*s+(H-vh*s)/2]};
function onResults(r){
 const vw=video.videoWidth||640,vh=video.videoHeight||480;
 hs=(r.multiHandLandmarks||[]).map(l=>{
  const p=l.map(q=>mapPt(q,vw,vh)),d=(a,b)=>Math.hypot(p[a][0]-p[b][0],p[a][1]-p[b][1]),ps=Math.max(d(0,9),1);
  let cx=0,cy=0;for(const i of[0,5,9,13,17]){cx+=p[i][0]/5;cy+=p[i][1]/5}
  const open=Math.min(1,Math.max(0,((d(8,0)+d(12,0)+d(16,0)+d(20,0))/4/ps-1.1)/.8));
  const pinch=1-Math.min(1,Math.max(0,(d(4,8)/ps-.28)/.55));
  const ex=[[6,8],[10,12],[14,16],[18,20]].map(a=>d(a[1],0)>d(a[0],0)*1.1),nx=ex.filter(Boolean).length,th=d(4,5)>ps*.62;
  const g=pinch>.6?'pinch':nx==4?'open':!nx&&!th?'fist':!nx&&th&&p[4][1]<p[2][1]-ps*.3?'thumb':ex[0]&&ex[1]&&!ex[2]&&!ex[3]?'peace':ex[0]&&!ex[1]&&!ex[2]&&!ex[3]?'point':ex[0]&&!ex[1]&&!ex[2]&&ex[3]?'rock':'';
  return{p,cx,cy,ps,open,pinch,g,roll:Math.atan2(p[9][0]-p[0][0],p[0][1]-p[9][1])};
 }).sort((a,b)=>a.cx-b.cx);
 lastSeen=performance.now();
}
const S={x:W/2,y:H/2,s:150,roll:0,ang:0,len:300,pinch:0,vis:0,spin:0};
const m4=new THREE.Matrix4(),eu=new THREE.Euler(),hint=$('#hint');let hintTxt='';
const TIPS=['✋/✊ o‘lcham · 🤏 portlash · ✌️ yurak ☝️ halqa 👍 yulduz 🤟 sfera · ⇆ surish — shakl · ⇅ rang/rejim','🙌 Ikki qo‘l orasida shakl · 🤏 tez aylanadi · ✌️ ☝️ 👍 🤟 — shakl turi · ⇆ ⇅ surish','🤏 Chimchilab havoda chizing · ⇅ yuqoriga — rang, pastga — rejim'];

function update(dt,t){
 const live=performance.now()-lastSeen<400,n=live?hs.length:0,mn=Math.min(W,H);
 let tx=W/2,ty=H/2,ts=mn*(.2+.015*Math.sin(t*1.5)),tr=0,ta=0,tl=0,tv=0,tp=0;
 if(n==1){const h=hs[0];tx=h.cx;ty=h.cy;ts=Math.min(h.ps*(.9+3.3*h.open),mn*.8);tr=ta=-h.roll;tl=Math.min(h.ps*(2.6+2.2*h.open),mn);tv=1;tp=h.pinch}
 else if(n>1){const a=hs[0],b=hs[1],dx=b.cx-a.cx,dy=b.cy-a.cy,d=Math.hypot(dx,dy);
  tx=(a.cx+b.cx)/2;ty=(a.cy+b.cy)/2;ta=tr=Math.atan2(-dy,dx);ts=Math.min(d/2*(.7+.5*(a.open+b.open)/2),mn*.9);tl=d*1.15;tv=1;tp=Math.max(a.pinch,b.pinch)}
 const k=1-Math.exp(-dt*(n?16:5)),ks=1-Math.exp(-dt*10);
 S.x+=(tx-S.x)*k;S.y+=(ty-S.y)*k;S.s+=(ts-S.s)*ks;if(tl)S.len+=(tl-S.len)*ks;
 S.roll+=wrap(tr-S.roll)*ks;S.ang+=wrap(ta-S.ang)*k;
 S.pinch+=(tp-S.pinch)*(1-Math.exp(-dt*12));S.vis+=(tv-S.vis)*(1-Math.exp(-dt*8));
 S.spin+=dt*(.7+S.pinch*5);
 mix=Math.min(1,mix+dt*1.4);
 for(let i=1;i<4;i++)U['c'+i].value.lerp(tc[i-1],1-Math.exp(-dt*4));
 U.uT.value=t;U.uMix.value=mix;U.uS.value=S.s;U.uB.value=S.pinch*.9;U.uC.value.set(S.x,H-S.y,0);
 U.uPx.value=dpr*Math.min(2,Math.max(.9,mn/420));
 U.uRot.value.setFromMatrix4(m4.makeRotationFromEuler(eu.set((.5-S.y/H)*.7+.2*Math.sin(t*.4),(S.x/W-.5)*.9,S.roll,'XYZ')));
 pts.visible=mode===0;pr.visible=mode===1&&S.vis>.02;
 if(pr.visible){const L=Math.max(S.len,1)*S.vis,rad=Math.min(Math.max(L*.17,8),mn*.22);
  pr.position.set(S.x,H-S.y,0);pr.rotation.z=S.ang;pm.scale.set(L,rad,rad);pm.rotation.x=S.spin}
 const ht=n?TIPS[mode]:'✋ Qo‘l(lar)ingizni kameraga ko‘rsating';
 if(ht!==hintTxt){hint.textContent=hintTxt=ht}
 gesture(dt,n);audioTick();if(mode===2)trail(dt,t,n);else if(trailOn)clearTrail();
}

/* ---------- Skelet ---------- */
const sk=$('#sk'),sx=sk.getContext('2d');
const CON=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20],[5,9,13,17]];
function drawSk(){
 sx.setTransform(dpr,0,0,dpr,0,0);sx.clearRect(0,0,W,H);
 if(!showSk||performance.now()-lastSeen>400)return;
 sx.lineWidth=2;sx.lineCap=sx.lineJoin='round';sx.strokeStyle='rgba(255,200,140,.55)';sx.fillStyle='#fff';
 for(const h of hs){
  sx.beginPath();for(const c of CON)c.forEach((i,j)=>{const q=h.p[i];j?sx.lineTo(q[0],q[1]):sx.moveTo(q[0],q[1])});sx.stroke();
  sx.beginPath();for(const i of[4,8,12,16,20]){const q=h.p[i];sx.moveTo(q[0]+4,q[1]);sx.arc(q[0],q[1],4,0,6.2832)}sx.fill();
 }
}

/* ---------- Havoda chizish ---------- */
const tr=$('#tr'),tx=tr.getContext('2d');let prevT=[],trailOn=false;
function trail(dt,t,n){
 trailOn=true;tx.setTransform(dpr,0,0,dpr,0,0);
 tx.globalCompositeOperation='destination-out';tx.fillStyle='rgba(0,0,0,'+Math.min(1,dt*.9)+')';tx.fillRect(0,0,W,H);
 tx.globalCompositeOperation='lighter';tx.lineCap='round';
 hs.forEach((h,i)=>{
  if(!n||h.pinch<.55){prevT[i]=null;return}
  let q=[(h.p[4][0]+h.p[8][0])/2,(h.p[4][1]+h.p[8][1])/2];const o=prevT[i];
  if(o){q=[o[0]+(q[0]-o[0])*.6,o[1]+(q[1]-o[1])*.6];tx.strokeStyle='hsl('+((t*60+i*140)%360)+',100%,62%)';tx.shadowColor=tx.strokeStyle;tx.shadowBlur=18;tx.lineWidth=6;tx.beginPath();tx.moveTo(o[0],o[1]);tx.lineTo(q[0],q[1]);tx.stroke()}
  prevT[i]=q;
 });
}
function clearTrail(){tx.setTransform(1,0,0,1,0,0);tx.clearRect(0,0,tr.width,tr.height);trailOn=false;prevT=[]}

/* ---------- Ishoralar (ushlab turilganda ishlaydi) ---------- */
const SHAPE_N=['Galaktika','Sfera','Yurak','Halqa','Yulduz'],PRISM_N=['Uchburchak prizma','To‘rtburchak','Oltiburchak','Silindr'],PAL_N=['Olov','Muz','Zumrad','Pushti'],MODE_N=['✨ Zarra','🔷 Prizma','✍️ Chizish'],SEG=[3,4,6,24];
let gk='',gt=0,armed=true,segI=0;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1400)}
function nextShape(d,i){d=d||1;if(mode===1){segI=i==null?(segI+d+4)%4:i%4;mkPrism(SEG[segI]);toast('🔷 '+PRISM_N[segI])}else{shapeI=i==null?(shapeI+d+shapes.length)%shapes.length:i;setShape(shapeI);setMode(0);toast('🌀 '+SHAPE_N[shapeI])}sfx('shape')}
function nextColor(){palI=(palI+1)%PAL.length;setPal();toast('🎨 '+PAL_N[palI]);sfx('color')}
function nextMode(){setMode((mode+1)%3);toast(MODE_N[mode]);sfx('shape')}
const GS={peace:2,point:3,thumb:4,rock:1};let sw=[],swT=0;
function gesture(dt,n){
 const g=n&&mode!==2?(hs.map(h=>h.g).find(x=>GS[x]!=null)||''):'';
 if(g!==gk){gk=g;gt=0;armed=true}else if(g&&armed&&(gt+=dt)>.5){armed=false;nextShape(1,GS[g])}
 const now=performance.now(),h=n&&hs.find(x=>x.g==='open');
 if(!h){sw=[];return}
 sw.push([now,h.cx,h.cy]);while(now-sw[0][0]>280)sw.shift();
 if(now<swT||sw.length<4)return;
 const dx=h.cx-sw[0][1],dy=h.cy-sw[0][2];
 if(Math.abs(dx)>W*.4&&Math.abs(dx)>2*Math.abs(dy)){if(mode===2)return;swT=now+900;sw=[];sfx('swipe',dx);nextShape(dx>0?1:-1)}
 else if(Math.abs(dy)>H*.4&&Math.abs(dy)>2*Math.abs(dx)){swT=now+900;sw=[];sfx('swipe',-dy);dy<0?nextColor():nextMode()}
}

/* ---------- Ovoz (WebAudio sintez) ---------- */
let ac=null,mg=null,ad=null,hum=null,muted=false,pb=false;
function audioInit(){
 if(ac){ac.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 ac=new C();mg=ac.createGain();mg.connect(ac.destination);ad=ac.createMediaStreamDestination();mg.connect(ad);
 const f=ac.createBiquadFilter(),g=ac.createGain(),o1=ac.createOscillator(),o2=ac.createOscillator();
 f.type='lowpass';g.gain.value=0;o1.type='sawtooth';o2.type='sine';o2.detune.value=7;
 o1.connect(f);o2.connect(f);f.connect(g);g.connect(mg);o1.start();o2.start();hum={o1,o2,f,g};
}
function tone(f,d,ty,v,sl){const T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,T);if(sl)o.frequency.exponentialRampToValueAtTime(sl,T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(mg);o.start(T);o.stop(T+d)}
function whoosh(dir){
 const T=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.Q.value=3;
 f.frequency.setValueAtTime(dir>0?400:2600,T);f.frequency.exponentialRampToValueAtTime(dir>0?2600:400,T+.4);
 g.gain.setValueAtTime(.001,T);g.gain.linearRampToValueAtTime(.35,T+.12);g.gain.exponentialRampToValueAtTime(.001,T+.45);
 s.connect(f);f.connect(g);g.connect(mg);s.start(T);
}
function sfx(k,dir){
 if(!ac)return;
 if(k==='shape'){tone(520,.15,'triangle',.18);setTimeout(()=>tone(780,.2,'sine',.14),90)}
 else if(k==='color')tone(1000,.35,'sine',.12,1900);
 else if(k==='boom'){tone(170,.55,'sine',.35,38);whoosh(1)}
 else if(k==='swipe')whoosh(dir||1);
 else tone(900,.06,'square',.07);
}
function audioTick(){
 if(!ac)return;const T=ac.currentTime,y=1-S.y/H;
 hum.g.gain.setTargetAtTime(S.vis*.045*(.5+S.s/Math.min(W,H)),T,.12);
 hum.o1.frequency.setTargetAtTime(70+y*130,T,.08);hum.o2.frequency.setTargetAtTime(140+y*260,T,.08);
 hum.f.frequency.setTargetAtTime(300+S.pinch*2200+S.s*2,T,.08);
 if(S.pinch>.75&&!pb&&mode!==2){pb=true;sfx('boom')}else if(S.pinch<.4)pb=false;
}

/* ---------- Rasm va video (kamera + effektlar birga) ---------- */
const cc=document.createElement('canvas'),cg=cc.getContext('2d');let mr=null,chunks=[],snap=false,recT=0;
function compose(){
 const s=Math.min(1,1280/Math.max(W,H)),cw=W*s|0,ch=H*s|0;
 if(cc.width!==cw||cc.height!==ch){cc.width=cw;cc.height=ch}
 const vw=video.videoWidth||640,vh=video.videoHeight||480,k=Math.max(W/vw,H/vh);
 cg.setTransform(s,0,0,s,0,0);cg.fillStyle='#05060d';cg.fillRect(0,0,W,H);
 cg.save();if(mir){cg.translate(W,0);cg.scale(-1,1)}cg.drawImage(video,(W-vw*k)/2,(H-vh*k)/2,vw*k,vh*k);cg.restore();
 cg.fillStyle='rgba(0,0,0,.58)';cg.fillRect(0,0,W,H);cg.drawImage(renderer.domElement,0,0,W,H);cg.drawImage(tr,0,0,W,H);
}
function save(b,ext){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hand-magic-'+Date.now()+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#snap').onclick=()=>{if(!hands)return;snap=true;sfx('click')};
$('#rec').onclick=()=>{
 if(mr){mr.stop();return}
 if(!window.MediaRecorder||!hands){toast('Video yozish mavjud emas');return}
 compose();const st=cc.captureStream(30);if(ad)ad.stream.getAudioTracks().forEach(t=>st.addTrack(t));
 const mt=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 mr=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{videoBitsPerSecond:6e6});chunks=[];
 mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 mr.onstop=()=>{const ty=mr.mimeType||'video/webm';save(new Blob(chunks,{type:ty}),ty.includes('mp4')?'mp4':'webm');mr=null;$('#rec').classList.remove('on');$('#rec').textContent='⏺';toast('🎬 Video saqlandi')};
 mr.start(500);recT=performance.now();$('#rec').classList.add('on');$('#rec').textContent='⏹';sfx('click');
};
$('#snd').onclick=e=>{if(!ac)return;muted=!muted;mg.gain.value=muted?0:1;e.currentTarget.textContent=muted?'🔇':'🔊'};

/* ---------- O‘lcham, sikl ---------- */
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H);cam.right=W;cam.top=H;cam.updateProjectionMatrix();sk.width=tr.width=W*dpr;sk.height=tr.height=H*dpr}
addEventListener('resize',resize);resize();
let last=performance.now(),fc=0,ft=last,low=0;
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt,now/1000);renderer.render(scene,cam);drawSk();
 if(mr||snap){compose();if(snap){snap=false;cc.toBlob(b=>{save(b,'png');toast('📸 Rasm saqlandi')})}}
 fc++;if(now-ft>500){const f=fc*1000/(now-ft);$('#fps').textContent=(mr?'● '+((now-recT)/1000|0)+' s  ':'')+Math.round(f)+' FPS';fc=0;ft=now;if(f<28&&hands){if(++low>5&&dpr>1){dpr=1;renderer.setPixelRatio(1);resize()}}else low=0}
}
requestAnimationFrame(loop);

/* ---------- Kuzatuv sikli ---------- */
let busy=false,lastV=-1;
async function track(){
 if(!busy&&video.readyState>=2&&video.currentTime!==lastV){busy=true;lastV=video.currentTime;try{await hands.send({image:video})}catch(e){}busy=false}
 video.requestVideoFrameCallback?video.requestVideoFrameCallback(track):requestAnimationFrame(track);
}
let facing='user',stream=null;
async function openCam(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:60,min:24}}});
 video.srcObject=stream;await video.play();mir=facing==='user';video.style.transform=mir?'':'none';
}
$('#go').onclick=async()=>{
 const m=$('#msg');
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Kamera faqat HTTPS (yoki localhost) orqali ishlaydi.');
  if(typeof Hands==='undefined')throw Error('MediaPipe yuklanmadi. Internetni tekshiring.');
  audioInit();m.textContent='Kamera yoqilmoqda…';
  await openCam();
  m.textContent='Qo‘l modeli yuklanmoqda…';
  hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
  hands.setOptions({maxNumHands:2,modelComplexity:mobile?0:1,minDetectionConfidence:.6,minTrackingConfidence:.55});
  hands.onResults(onResults);await hands.initialize();
  $('#start').classList.add('hide');track();
 }catch(e){m.textContent=e.name==='NotAllowedError'?'Kameraga ruxsat berilmadi. Brauzer sozlamalarida yoqing.':(e.message||'Xatolik yuz berdi.')}
};

/* ---------- Tugmalar ---------- */
const mb=document.querySelectorAll('[data-m]');
const setMode=m=>{mode=m;mb.forEach(b=>b.classList.toggle('on',+b.dataset.m===m));hintTxt=''};
mb.forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
$('#shape').onclick=()=>nextShape();$('#color').onclick=nextColor;
$('#cam').onclick=async()=>{if(!hands)return;facing=facing==='user'?'environment':'user';
 try{await openCam();toast(mir?'📷 Old kamera':'📷 Orqa kamera')}catch(e){facing=facing==='user'?'environment':'user';openCam().catch(()=>{});toast('Kamera almashmadi')}};
$('#skel').onclick=e=>{showSk=!showSk;e.currentTarget.classList.toggle('on',showSk)};
})();
</script>
